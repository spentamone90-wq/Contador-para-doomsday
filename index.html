<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avengers: Doomsday - Cuenta Regresiva</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-layer"></div>
    <div class="vignette"></div>

    <main class="container">
        <header class="header">
            <h1 class="movie-title">DOOMSDAY SE ACERCA</h1>
        </header>

        <div class="countdown-wrapper" id="countdown">
            <div class="time-block">
                <div class="digits-container" id="days-digits"></div>
                <span class="time-label">DÍAS</span>
            </div>
            <div class="colon">:</div>
            <div class="time-block">
                <div class="digits-container" id="hours-digits"></div>
                <span class="time-label">HORAS</span>
            </div>
            <div class="colon">:</div>
            <div class="time-block">
                <div class="digits-container" id="minutes-digits"></div>
                <span class="time-label">MINUTOS</span>
            </div>
            <div class="colon">:</div>
            <div class="time-block">
                <div class="digits-container" id="seconds-digits"></div>
                <span class="time-label">SEGUNDOS</span>
            </div>
        </div>

        <footer class="footer">
            <div class="footer-line"></div>
            <p class="footer-text">LA CUENTA REGRESIVA HA COMENZADO</p>
            <div class="footer-line"></div>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
